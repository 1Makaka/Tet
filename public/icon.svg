<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="6" />

  <!-- Background decorative glow circle -->
  <circle cx="256" cy="230" r="140" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Dumbbell / Muscle Power Symbol -->
  <g transform="translate(0, -10)">
    <!-- Dumbbell Left Weight -->
    <rect x="136" y="180" width="28" height="100" rx="8" fill="url(#primaryGrad)" filter="url(#glow)" />
    <rect x="116" y="195" width="22" height="70" rx="6" fill="#0284c7" />
    
    <!-- Dumbbell Right Weight -->
    <rect x="348" y="180" width="28" height="100" rx="8" fill="url(#primaryGrad)" filter="url(#glow)" />
    <rect x="374" y="195" width="22" height="70" rx="6" fill="#0284c7" />

    <!-- Center Bar -->
    <rect x="160" y="218" width="192" height="24" rx="6" fill="#f8fafc" />
    <rect x="236" y="212" width="40" height="36" rx="4" fill="url(#accentGrad)" />

    <!-- Center Lightning / Peak Mass Bolt -->
    <path d="M 268 130 L 232 215 L 260 215 L 244 290 L 286 200 L 258 200 Z" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Text "LEAN BULK" -->
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">LEAN BULK</text>
  
  <!-- Badge 2800 KCAL -->
  <g transform="translate(166, 400)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
    <text x="90" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">2800 KCAL</text>
  </g>
</svg>
